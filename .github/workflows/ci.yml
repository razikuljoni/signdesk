name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signdesk
          POSTGRES_PASSWORD: signdesd_test_secret
          POSTGRES_DB: signdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Prisma Migrations & Generate
        env:
          DATABASE_URL: postgresql://signdesk:signdesd_test_secret@localhost:5432/signdesk_test?schema=public
        run: |
          pnpm --filter @signdesk/api prisma:generate
          pnpm --filter @signdesk/api prisma:migrate:deploy

      - name: Unit & Integration Tests (Jest)
        env:
          DATABASE_URL: postgresql://signdesk:signdesd_test_secret@localhost:5432/signdesk_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm test:unit

      - name: API Tests (Supertest)
        env:
          DATABASE_URL: postgresql://signdesk:signdesd_test_secret@localhost:5432/signdesk_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm test:api
